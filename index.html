<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Indexicality — Annotated Bibliography</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { min-height: 100vh; }
    #book {
      width: 100%;
      height: 84vh;
      min-height: 480px;
      background: #000;
      --fb-bg: #000;
      --fb-paper: #fff;
      --fb-control-bg: rgba(25, 25, 25, .92);
      --fb-control-fg: #fff;
      --fb-counter-fg: #fff;
      --fb-shadow: 0 20px 50px rgba(0,0,0,.45);
    }
    .page-title {
      color: #aaa;
      font-size: 12px;
      text-align: center;
      padding: 10px 12px 14px;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <div id="book"
       data-pdflipbook="indexicality.pdf"
       data-start-page="1"
       data-arrows="true"
       data-page-numbers="true"
       data-display-mode="auto"
       data-controls="true"
       data-shadow="none"
       style="height:84vh; min-height:480px; background:#000;">
  </div>
  <script src="./pdflipbook.js"></script>
</body>
</html>
